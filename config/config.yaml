pepfile: config/pep/config.yaml

## this will be used as name for the results folder and can be found in the report
run-date: "WW-16S-26-03__20260625_SL00554_0003_ASC2192826-SC3__1__FW"

## Pipeline mode: "qc" (fastp/fastqc/multiqc/human-contamination, NO kaiju)
## or "diversity" (kaiju taxonomic profiling on already-preprocessed reads).
## Default is qc. run_qc.sh sets this per invocation.
mode: "qc"

testing: False

## Option for the auto-creation of the sample sheet
sample-sheet:
  # False or True : Should the sample sheet be auto-created?
  auto-creation: False
  # False or True : Should the sample fastqs be renamed?
  # e.g. from sampleID_S40_L001_R1_001.fastq.gz to sampleID_R1.fastq.gz
  rename-sample-files: False
  # path to the fastq files of the samples for the sample sheet
  data-path: "/groups/ds/metagenomes/231218_Miseq/"

## Preprocessed reads handed back to the type pipelines (isolate/metagenome/16S)
## so they can skip their own fastp/host-filtering. When True the deposited reads
## are fastp-trimmed AND human-removed (mirrors ResMAG's host_filtering); when
## False they are trimmed only. Either way %human is still MEASURED for
## qc_metrics — this flag only controls whether human reads are REMOVED from the
## reads we persist. Toggle off if a sample type should keep its human reads.
remove-human: True

## Whether to PRODUCE + deposit the preprocessed reads at all. run_qc.sh sets this
## per type: False for 16S (which keeps its own QIIME2 QC — primer trimming +
## DADA2 — so fastp-trimmed reads aren't consumable there; only QC metrics are
## wanted), True for isolate/metagenome. QC metrics are generated regardless.
emit-preprocessed: True

human-ref:
  use-local: True
  # path to a locally stored human reference genome
  local-path: "/groups/ds/databases_refGenomes/refGenomes/latest/human/GRCh38_latest_genomic.fna.gz"
  # if use-local = False the reference genome is downloaded via the following link
  download-path: "https://ftp.ncbi.nlm.nih.gov/refseq/H_sapiens/annotation/GRCh38_latest/refseq_identifiers/GRCh38_latest_genomic.fna.gz"

kaiju-db:
  use-shared: True
  # if use-shared False: DB is downloaded and saved to these paths
  fmi-file: "/groups/ds/databases_refGenomes/databases/latest/kaiju/refseq_nr/unpacked_2024-08-13/kaiju_db_refseq_nr.fmi"
  nodes-dmp: "/groups/ds/databases_refGenomes/databases/latest/kaiju/refseq_nr/unpacked_2024-08-13/nodes.dmp"
  names-dmp: "/groups/ds/databases_refGenomes/databases/latest/kaiju/refseq_nr/unpacked_2024-08-13/names.dmp"

  download: "https://kaiju-idx.s3.eu-central-1.amazonaws.com/2024/kaiju_db_refseq_nr_2024-08-13.tgz"

## qualtiy criteria used for filtering
quality-criteria:
  # minimal length of acceptable reads (aligned with the isolate/metagenome
  # type pipelines so the preprocessed reads are reusable by them)
  min-length-reads: 30
  # average quality of acceptable reads (PHRED)
  min-PHRED: 20

## adapter sequences used for trimming. Nextera transposase adapters — matching
## the isolate (phyloTree) and metagenome (ResMAG) pipelines so the trimmed
## reads are interchangeable. fastp only trims where the adapter is actually
## found, so this is safe for 16S amplicon reads too (no forced clipping).
adapter-seqs: "-a CTGTCTCTTATACACATCT -g AGATGTGTATAAGAGACAG"

# path to store databases and reference genomes used within the workflow
resources: "resources/"

## string term used for formatting output tables
tablular-config: '/>github<\/a>/a \\t\t\t</li>\n\t\t\t<li class="nav-item"> \n\t\t\t\t<a class="nav-link" href="#">'
